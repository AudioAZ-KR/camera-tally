<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AudioAZ 탈리</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  #setup { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 24px; }
  #setup h1 { font-size: 28px; margin-bottom: 8px; }
  #setup label { width: 100%; max-width: 320px; font-size: 14px; color: var(--muted); }
  #setup img { height: 36px; margin-bottom: 4px; }
  #setup input { width: 100%; margin-top: 6px; font-size: 22px; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-align: center; }
  #setup button { width: 100%; max-width: 320px; font-size: 20px; padding: 16px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; font-weight: bold; }

  /* ===== 탈리 화면: 위 50% 탈리 / 아래 50% 정보 ===== */
  #tally { display: none; height: 100%; flex-direction: column; }
  #light { flex: 0 0 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
           padding-top: env(safe-area-inset-top); transition: background .1s; }
  #tally.idle #light { background: #1a2538; }
  #tally.pvw  #light { background: var(--tally-pvw); }
  #tally.pgm  #light { background: var(--tally-pgm); }
  #tally.off  #light { background: var(--tally-off); }
  #light .cam { font-size: min(28vh, 45vw); font-weight: 900; line-height: 1; }
  #light .status { font-size: min(5.5vh, 9vw); font-weight: 800; letter-spacing: .12em; margin-top: 4px; }
  #light .pgmpvw { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 0; right: 0; text-align: center; font-size: 14px; opacity: .8; }
  #light .pgmpvw b { font-size: 18px; }

  #panel { flex: 0 0 50%; background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 14px calc(env(safe-area-inset-bottom) + 10px); gap: 10px; overflow: hidden; }
  .clock { text-align: center; }
  .clock small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .clock b { font-size: min(9vh, 17vw); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: .02em; }
  .row2 { display: flex; gap: 10px; }
  .tile { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; text-align: center; min-height: 64px; }
  .tile small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-bottom: 2px; }
  .tile b { font-size: min(5vh, 9.5vw); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile.empty b { color: var(--muted); font-size: 3vh; font-weight: 500; }
  .tile.warn b { color: #FFD166; }
  .tile.over b { color: #FF6B6B; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #msg { flex: 1; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--brand); border-radius: 12px; padding: 10px 14px; overflow: auto; }
  #msg small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-bottom: 4px; }
  #msg .t { font-size: min(3.6vh, 6vw); font-weight: 700; line-height: 1.3; word-break: keep-all; }
  #msg.empty .t { color: var(--muted); font-weight: 400; font-size: 3vh; }
  #msg.new { animation: pop .5s ease; }
  @keyframes pop { 0% { background: var(--brand); } 100% { background: var(--surface); } }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .foot img { height: 14px; opacity: .8; vertical-align: middle; margin-right: 6px; }
  .foot button { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 12px; }

  /* 표시 스타일 선택 (설정 화면) */
  .segmt { display:flex; margin-top:6px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .seg { flex:1; background:var(--surface); color:var(--muted); border:0; padding:12px 0; font-size:16px; font-weight:bold; cursor:pointer; }
  .seg.on { background:var(--brand); color:#fff; }

  /* 테두리(네온) 모드: 탈리 칸(#light) 안에만 발광 테두리. 아래 정보 패널에는 안 들어감 */
  #frame { display:none; }
  #tally.mode-border #light { background:var(--bg) !important; transition:box-shadow .18s ease, background .1s; }
  /* LED 발광 테두리: 선명한 띠 + 안쪽으로 은은하게 번지는 글로우 */
  #tally.mode-border.pgm  #light { box-shadow:inset 0 0 0 7px var(--tally-pgm), inset 0 0 13px 1px var(--tally-pgm), inset 0 0 27px 3px color-mix(in srgb, var(--tally-pgm) 55%, transparent); }
  #tally.mode-border.pvw  #light { box-shadow:inset 0 0 0 7px var(--tally-pvw), inset 0 0 13px 1px var(--tally-pvw), inset 0 0 27px 3px color-mix(in srgb, var(--tally-pvw) 55%, transparent); }
  #tally.mode-border.idle #light { box-shadow:inset 0 0 0 4px #34405e, inset 0 0 8px 0 rgba(52,64,94,.6); }
  #tally.mode-border.off  #light { box-shadow:inset 0 0 0 4px var(--tally-off); }
  #tally.mode-border.pgm  #light .cam, #tally.mode-border.pgm  #light .status { color:var(--tally-pgm); text-shadow:0 0 7px color-mix(in srgb, var(--tally-pgm) 70%, transparent); }
  #tally.mode-border.pvw  #light .cam, #tally.mode-border.pvw  #light .status { color:var(--tally-pvw); text-shadow:0 0 7px color-mix(in srgb, var(--tally-pvw) 70%, transparent); }
  #tally.mode-border.idle #light .cam { color:var(--muted); }
  #tally.mode-border #styleToggle { margin-right:6px; }

  /* ===== 아이폰 가로모드: 좌(탈리) / 우(시각·타이머·공지) =====
     높이가 낮은 기기(폰)에서만 적용 — 아이패드는 세로 분할 유지 */
  @media (orientation: landscape) and (max-height: 500px) {
    #tally { flex-direction: row; }
    #light { flex: 0 0 50%; height: 100%; padding-top: 0; padding-left: env(safe-area-inset-left); }
    #light .cam { font-size: min(52vh, 22vw); }
    #light .status { font-size: min(11vh, 4.5vw); }
    #light .pgmpvw { top: 8px; }
    #panel { flex: 0 0 50%; height: 100%; border-top: 0; border-left: 1px solid var(--border);
             padding: 8px 12px 8px 12px; padding-right: calc(env(safe-area-inset-right) + 10px); gap: 6px; }
    .clock b { font-size: min(13vh, 6vw); }
    .clock small { font-size: 9px; }
    .tile { min-height: 0; padding: 4px 8px; }
    .tile b { font-size: min(9vh, 4vw); }
    .tile.empty b { font-size: min(7vh, 3vw); }
    .tile small { font-size: 9px; margin-bottom: 0; }
    #msg { padding: 6px 10px; }
    #msg .t { font-size: min(8vh, 3.2vw); }
    #msg.empty .t { font-size: min(7vh, 2.8vw); }
    #msg small { font-size: 9px; margin-bottom: 2px; }
    .foot { font-size: 10px; }
    .foot button { padding: 2px 8px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="setup">
  <img src="/logo.svg" alt="AudioAZ" onerror="this.remove()">
  <h1>카메라 탈리</h1>
  <label>방 코드<input id="room" placeholder="STUDIO" autocapitalize="characters"></label>
  <label>내 카메라 번호<input id="cam" type="number" inputmode="numeric" placeholder="1" min="1" max="20"></label>
  <label>표시 스타일
    <div class="segmt">
      <button type="button" class="seg" id="styleFull">전체화면</button>
      <button type="button" class="seg" id="styleBorder">테두리(네온)</button>
    </div>
  </label>
  <button id="go">접속</button>
</div>

<div id="tally" class="off">
  <div id="frame"></div>
  <div id="light">
    <div class="pgmpvw">송출 <b id="pgmNo">-</b> &nbsp;·&nbsp; 대기 <b id="pvwNo">-</b></div>
    <div class="cam" id="myCam">1</div>
    <div class="status" id="status">연결 중</div>
  </div>
  <div id="panel">
    <div class="clock"><small>현재 시각</small><b id="clock">--:--:--</b></div>
    <div class="row2">
      <div class="tile empty" id="targetTile"><small id="targetLabel">목표 시각</small><b id="targetLeft">미설정</b></div>
      <div class="tile empty" id="timerTile"><small id="timerLabel">타이머</small><b id="timerLeft">미설정</b></div>
    </div>
    <div id="msg" class="empty"><small>공지</small><div class="t" id="msgText">공지 없음</div></div>
    <div class="foot"><span><img src="/logo.svg" alt="" onerror="this.remove()"><span id="conn">서버 연결 중…</span></span><span><button id="styleToggle">테두리</button><button id="leave">설정</button></span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
$('room').value = qs.get('room') || localStorage.room || '';
$('cam').value  = qs.get('cam')  || localStorage.cam  || '';
let ws, room, cam, wakeLock, pingTimer;
let dispStyle = localStorage.dispStyle || 'full', curState = 'off';
function applyStyle() {
  $('tally').className = curState + (dispStyle === 'border' ? ' mode-border' : '');
  $('styleFull').classList.toggle('on', dispStyle === 'full');
  $('styleBorder').classList.toggle('on', dispStyle === 'border');
  if ($('styleToggle')) $('styleToggle').textContent = (dispStyle === 'border') ? '전체화면' : '테두리';
}
function setStyle(v) { dispStyle = v; localStorage.dispStyle = v; applyStyle(); }
$('styleFull').onclick = () => setStyle('full');
$('styleBorder').onclick = () => setStyle('border');

$('go').onclick = () => {
  room = $('room').value.trim().toUpperCase() || 'DEFAULT';
  cam  = parseInt($('cam').value) || 1;
  localStorage.room = room; localStorage.cam = cam;
  $('setup').style.display = 'none'; $('tally').style.display = 'flex';
  $('myCam').textContent = cam;
  applyStyle(); connect(); keepAwake();
  document.documentElement.requestFullscreen?.().catch(()=>{});
};
function sayLeave() { try { if (ws && ws.readyState === 1) ws.send('{"type":"leave"}'); } catch {} }
$('styleToggle').onclick = () => setStyle(dispStyle === 'border' ? 'full' : 'border');
$('leave').onclick = () => { sayLeave(); manualClose = true; ws?.close(); clearInterval(pingTimer); $('tally').style.display='none'; $('setup').style.display='flex'; };
addEventListener('pagehide', sayLeave); addEventListener('beforeunload', sayLeave);
let manualClose = false;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { ws.send(JSON.stringify({type:'join', role:'phone', room, cam}));
    const mode = /onrender\.com|^https:/.test(location.host + '|' + location.protocol) && location.protocol === 'https:' ? '🌐 온라인' : '📡 오프라인(같은 Wi-Fi)';
    $('conn').textContent = `방 ${room} · 연결됨 · ${mode}`;
    pingTimer = setInterval(()=>ws.readyState===1 && ws.send('{"type":"ping"}'), 8000); };
  ws.onmessage = e => { const d = JSON.parse(e.data);
    if (d.type === 'tally') render(d);
    else if (d.type === 'msg') showMsg(d);
    else if (d.type === 'timer') setTimer(d); };
  ws.onclose = () => { clearInterval(pingTimer); if (manualClose) { manualClose = false; return; } setTally('off', '연결 끊김'); $('conn').textContent = '재연결 중…'; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
function render(d) {
  $('pgmNo').textContent = d.program || '-'; $('pvwNo').textContent = d.preview || '-';
  if (!d.online) return setTally('off', 'ATEM 오프라인');
  if (d.program === cam) { setTally('pgm', 'ON AIR'); navigator.vibrate?.(200); }
  else if (d.preview === cam) setTally('pvw', 'PREVIEW');
  else setTally('idle', '대기');
}
function setTally(cls, txt) { curState = cls; $('tally').className = cls + (dispStyle === 'border' ? ' mode-border' : ''); $('status').textContent = txt; }

// ---- 공지 메시지 ----
let lastMsgTs = 0;
function showMsg(d) {
  const box = $('msg');
  if (!d.text) { box.className = 'empty'; $('msgText').textContent = '공지 없음'; lastMsgTs = d.ts || 0; return; }
  $('msgText').textContent = d.text; box.className = '';
  if (d.ts && d.ts !== lastMsgTs) { navigator.vibrate?.([100, 60, 100]); box.classList.add('new'); setTimeout(() => box.classList.remove('new'), 600); }
  lastMsgTs = d.ts || 0;
}

// ---- 시계 / 목표 시각 / 타이머 ----
let timer = { running: false, end: 0, remain: 0, target: 0 }, clockOffset = 0; // clockOffset = 서버시각 - 내 시각
function setTimer(d) { timer = d; if (d.now) clockOffset = d.now - Date.now(); tick(); }
const pad = n => String(n).padStart(2, '0');
function fmt(ms, showH) {
  // 초과(음수)는 "+MM:SS" 로 초과 시간을 표시
  const over = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (over ? '+' : '') + (h || showH ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`);
}
function tick() {
  const now = new Date();
  $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const srvNow = Date.now() + clockOffset;
  const tt = $('targetTile');
  if (timer.target) {
    const left = timer.target - srvNow, t = new Date(timer.target);
    $('targetLabel').textContent = left < 0 ? `목표 ${pad(t.getHours())}:${pad(t.getMinutes())} 초과` : `목표 ${pad(t.getHours())}:${pad(t.getMinutes())} 까지`;
    $('targetLeft').textContent = fmt(left, true);
    tt.className = 'tile' + (left < 0 ? ' over' : left < 60000 ? ' warn' : '');
  } else { $('targetLabel').textContent = '목표 시각'; $('targetLeft').textContent = '미설정'; tt.className = 'tile empty'; }
  const tm = $('timerTile');
  if (timer.running || timer.remain) {
    const left = timer.running ? timer.end - srvNow : timer.remain;
    $('timerLeft').textContent = fmt(left);                       // 0 아래로 내려가면 +초과시간
    $('timerLabel').textContent = (timer.running && left < 0) ? '타이머 초과' : '타이머';
    tm.className = 'tile' + (timer.running && left <= 0 ? ' over' : (timer.running && left < 10000 ? ' warn' : ''));
  } else { $('timerLeft').textContent = '미설정'; $('timerLabel').textContent = '타이머'; tm.className = 'tile empty'; }
}
setInterval(tick, 250); tick();
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (ws && ws.readyState !== 1 && $('tally').style.display === 'flex') connect(); } });
}
applyStyle();
if ($('room').value && $('cam').value && qs.get('auto')) $('go').click();
</script>
</body>
</html>
