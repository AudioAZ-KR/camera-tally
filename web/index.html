<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카메라 탈리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; padding: 24px; max-width: 560px; margin: 0 auto; line-height: 1.5; }
  h1 { font-size: 26px; margin: 16px 0 4px; }
  p.sub { color: #999; margin-bottom: 28px; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card h2 { font-size: 17px; margin-bottom: 12px; }
  input { width: 100%; font-size: 20px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; text-align: center; margin: 6px 0 12px; }
  button { width: 100%; font-size: 17px; padding: 14px; border-radius: 10px; border: 0; background: #e33; color: #fff; font-weight: bold; cursor: pointer; }
  button.sec { background: #333; }
  .code { font-size: 44px; font-weight: 900; letter-spacing: .12em; text-align: center; margin: 8px 0; }
  pre { background: #000; padding: 12px; border-radius: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
  ol { padding-left: 20px; color: #ccc; font-size: 14px; } ol li { margin: 6px 0; }
  .cams { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .cams a { display: block; text-align: center; padding: 14px 0; background: #2a2a2a; border-radius: 10px; color: #fff; text-decoration: none; font-weight: bold; font-size: 18px; }
  small { color: #888; }
  #roomView { display: none; }
  .row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .row label { flex: 1; color: #ccc; font-size: 14px; }
  .row span { font-size: 22px; font-weight: bold; min-width: 32px; text-align: center; }
  button.sm { width: 44px; padding: 8px 0; font-size: 20px; }
</style>
</head>
<body>
<h1>📹 스마트폰 카메라 탈리</h1>
<p class="sub">ATEM Mini 탈리를 LTE/5G로 어디서나 스마트폰에 표시</p>

<div id="home">
  <div class="card">
    <h2>🎬 감독 — 새 방 만들기</h2>
    <button id="create">방 코드 생성</button>
  </div>
  <div class="card">
    <h2>📷 카메라맨 — 방에 접속</h2>
    <input id="joinRoom" placeholder="방 코드" autocapitalize="characters">
    <input id="joinCam" type="number" inputmode="numeric" placeholder="내 카메라 번호">
    <button class="sec" id="join">탈리 열기</button>
  </div>
</div>

<div id="roomView">
  <div class="card">
    <h2>방 코드</h2>
    <div class="code" id="code"></div>
    <small>이 코드를 카메라맨들에게 알려주세요.</small>
    <div class="row"><label>카메라 수</label><button class="sec sm" id="minus">−</button><span id="camCount">4</span><button class="sec sm" id="plus">＋</button></div>
    <small>탈리 페이지 공유 링크:</small>
    <div class="cams" id="cams"></div>
  </div>
  <div class="card">
    <h2>ATEM 연결 (브릿지)</h2>
    <ol>
      <li>ATEM Mini와 같은 네트워크의 PC(맥/윈도우/라즈베리파이)에서 Python 3 설치</li>
      <li><a href="/bridge.py" download style="color:#f66">bridge.py 다운로드</a></li>
      <li>터미널에서 실행:</li>
    </ol>
    <pre id="cmd"></pre>
    <small>ATEM IP는 ATEM Setup 앱에서 확인. 브릿지가 켜지면 탈리 화면이 회색→검정으로 바뀝니다.</small>
  </div>
  <button class="sec" id="back">처음으로</button>
</div>

<script>
const $ = id => document.getElementById(id);
const base = location.origin;
const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
let camCount = parseInt(localStorage.camCount) || 4, curCode = '';
function renderCams() {
  $('camCount').textContent = camCount; localStorage.camCount = camCount;
  $('cams').innerHTML = Array.from({length: camCount}, (_, i) => i + 1).map(n => `<a href="${base}/tally.html?room=${curCode}&cam=${n}&auto=1" target="_blank">CAM ${n}</a>`).join('');
}
$('minus').onclick = () => { if (camCount > 1) { camCount--; renderCams(); } };
$('plus').onclick  = () => { if (camCount < 20) { camCount++; renderCams(); } };
function showRoom(code) {
  $('home').style.display = 'none'; $('roomView').style.display = 'block';
  $('code').textContent = code; curCode = code; renderCams();
  $('cmd').textContent = `pip install websockets PyATEMMax\npython bridge.py --atem <ATEM_IP> --room ${code} --server ${wsUrl}`;
  history.replaceState(null, '', '?room=' + code);
}
$('create').onclick = () => {
  const c = Array.from({length: 6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  showRoom(c);
};
$('join').onclick = () => {
  const r = $('joinRoom').value.trim().toUpperCase(), c = $('joinCam').value;
  if (!r || !c) return alert('방 코드와 카메라 번호를 입력하세요');
  location.href = `/tally.html?room=${r}&cam=${c}&auto=1`;
};
$('back').onclick = () => { history.replaceState(null, '', '/'); $('roomView').style.display='none'; $('home').style.display='block'; };
const q = new URLSearchParams(location.search).get('room');
if (q) showRoom(q.toUpperCase());
</script>
</body>
</html>
